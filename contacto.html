<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunidad Felina - Contacto</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header>
        <h1>Únete a la Comunidad</h1>
    </header>
    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="cuidados.html">Cuidados Básicos</a></li>
            <li><a href="contacto.html">Contacto</a></li>
        </ul>
    </nav>
    <main>
        <section>
            <h2>Formulario de Contacto</h2>
            <form action="#" method="get">
                <div>
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" required minlength="3">
                </div>
                <div>
                    <label for="correo">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo" required>
                </div>
                <div>
                    <label for="tipo_gato">¿Tienes gatos?</label>
                    <select id="tipo_gato" name="tipo_gato" required>
                        <option value="">Seleccione una opción</option>
                        <option value="si">Sí, tengo uno o más</option>
                        <option value="no">No, pero quiero adoptar</option>
                    </select>
                </div>
                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>
    <footer>
        <p>Desarrollado para el Taller 01 de HTML5 y CSS3 | Santiago, Veraguas.</p>
    </footer>
</body>
</html>
